server:
  port: 8080

spring:
  config:
    import:
      - optional:configtree:./.secrets/
      - optional:configtree:./nebula-start/.secrets/
      - optional:configtree:../nebula-start/.secrets/
  application:
    name: nebula-article

  datasource:
    url: JDBC:mysql://localhost:3306/nebula_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${NEBULA_DB_USERNAME}
    password: ${NEBULA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-flex:

  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    print-banner: false
