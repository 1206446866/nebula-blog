server:
  port: 8080

spring:
  application:
    name: nebula-start

  #    时间格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: JDBC:mysql://localhost:3306/nebula_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    Hikari:
      maximum-pool-size: 20
      minimum-idle: 8
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          ssl:
            enable: true

mybatis-flex:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    print-banner: true

jwt:
#  secret：用作 HS256 签名密钥，必须保证长度足够（>=32字节），否则会报错。
  secret: nebula-blog-auth-secret-key-nebula-blog-auth-secret-key
#  expire：token 过期时间，单位毫秒，这里 604800000ms = 7天。
  expire: 604800000

file:
  upload-dir: upload/avatar/

#logging:
#  level:
#    org.springframework.security: DEBUG

