server:
  port: 8080
  forward-headers-strategy: none

spring:
  config:
    import:
      - optional:configtree:./.secrets/
      - optional:configtree:./nebula-start/.secrets/
  application:
    name: nebula-start

  #    时间格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: JDBC:mysql://localhost:3306/nebula_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${NEBULA_DB_USERNAME}
    password: ${NEBULA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    Hikari:
      maximum-pool-size: 20
      minimum-idle: 8
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        debug: false
        smtp:
          ssl:
            enable: true

mybatis-flex:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    print-banner: true

jwt:
  # Base64 of at least 32 random bytes; no shared/default signing key.
  secret: ${NEBULA_JWT_SECRET:}
#  expire：token 过期时间，单位毫秒，这里 604800000ms = 7天。
  expire: 604800000

file:
  upload-dir: upload/avatar/

