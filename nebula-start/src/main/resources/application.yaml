server:
  port: 8080
  forward-headers-strategy: none

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import:
      - optional:configtree:./.secrets/
      - optional:configtree:./nebula-start/.secrets/
  application:
    name: nebula-start

  #    时间格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: JDBC:mysql://localhost:3306/nebula_blog?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${NEBULA_DB_USERNAME}
    password: ${NEBULA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    Hikari:
      maximum-pool-size: 20
      minimum-idle: 8
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${NEBULA_REDIS_PASSWORD:}
      timeout: 10s

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        debug: false
        smtp:
          ssl:
            enable: true

mybatis-flex:
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    print-banner: true

jwt:
  # 至少32个随机字节的Base64密钥，不提供共享默认值。
  secret: ${NEBULA_JWT_SECRET:}
  # 新签发会话默认两小时，可按部署需要覆盖；已有会话按原有效期处理。
  expire: ${NEBULA_JWT_EXPIRE:7200000}

nebula:
  registration:
    confirmation-url: ${NEBULA_REGISTRATION_CONFIRMATION_URL:http://localhost:5173/register}

springdoc:
  api-docs:
    enabled: ${NEBULA_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${NEBULA_API_DOCS_ENABLED:false}

file:
  upload-root: ${NEBULA_UPLOAD_ROOT:upload}

